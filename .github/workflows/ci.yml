name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: lint + dependency smoke + audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node says >=20; 20 is the floor a deploy host might realistically
        # still be on, 22 is current LTS.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (production deps included, lockfile honoured)
        run: npm ci

      - name: Build the stylesheet the pages reference
        # public/css/app.css is gitignored on purpose; a missing one means every
        # page loads unstyled, and nothing else in CI would notice.
        run: npm run build:css

      - name: Lint
        run: npm run lint

      - name: Syntax-check every shipped file
        run: |
          find server public/js db scripts -name '*.js' -o -name '*.mjs' | while read -r f; do
            node --check "$f" || { echo "SYNTAX ERROR in $f"; exit 1; }
          done

      - name: Dependency + config smoke (no database needed)
        # Exercises multer, sharp, file-type, node-cron, express/qs, cookie, the
        # https-upgrade rule and the production seed guard against the real modules.
        run: npm test

      - name: Deploy pre-flight (offline)
        env:
          NODE_ENV: production
          APP_ORIGIN: https://ember.example.com
          # `db` is the compose hostname, which deploy-check treats as a private
          # network (no DB_SSL required); a public-looking host with no TLS would
          # correctly be a blocking finding and would fail this step.
          DB_HOST: db
          DB_PORT: '3306'
          DB_NAME: ember_ci
          DB_USER: ember
          DB_PASSWORD: ci-only-not-a-real-secret
          # Fallbacks are CI-only placeholders; they must still look like real
          # secrets, because deploy-check rejects single-character repeats on purpose.
          JWT_ACCESS_SECRET: ${{ secrets.CI_JWT_ACCESS_SECRET || '0f3a9c7b1e5d8a2c4b6f0d1e2c3a4b5c6d7e8f90' }}
          JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET || '9b2c4d6e8f0a1b3c5d7e9f0a2b4c6d8e0f1a2b3c' }}
          TRUST_PROXY: '1'
          FORCE_HTTPS: '1'
          UPLOAD_DIR: /tmp/ci-uploads
        run: node scripts/deploy-check.mjs --offline

      - name: Dependency audit
        # Blocking on high+. Right now the tree is clean; if an unfixed upstream
        # advisory appears (sharp/libvips has been this repo's recurring one),
        # widen this threshold rather than deleting the step.
        run: npm audit --audit-level=high

  deploy-verify:
    name: Boot the real app on MySQL 8 and sweep it
    runs-on: ubuntu-latest
    # A second job rather than more steps in `checks`: this one needs a database,
    # and when it fails the thing to read is the app log, not a lint diff.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: ember_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=25
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_NAME: ember_ci
      APP_ORIGIN: http://localhost:3000
      # Not real secrets - a throwaway database that dies with the runner. They are
      # here because env.js demands 32+ chars in production mode, and this job has
      # to boot in production mode to be worth running.
      JWT_ACCESS_SECRET: 0f3a9c7b1e5d8a2c4b6f0d1e2c3a4b5c6d7e8f90
      JWT_REFRESH_SECRET: 9b2c4d6e8f0a1b3c5d7e9f0a2b4c6d8e0f1a2b3c
      # A sweep plus the socket suite blow far past the per-IP ceilings a full run
      # would otherwise trip. Only these two blunt caps move: CSRF, the auth
      # limiter and every authorisation check stay at production values, which is
      # what makes the 401/403/404 assertions in the sweep meaningful.
      RATE_LIMIT_GLOBAL_PER_MIN: '100000'
      RATE_LIMIT_RESET_PER_15MIN: '1000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build:css

      - name: Apply the schema to a real MySQL 8
        # The canonical schema (no MariaDB rewrite path here), so collation and
        # generated-column problems surface on the runner instead of on a host.
        run: node db/migrate.js

      - name: A container restart must not destroy data
        # The image and compose both run `node db/migrate.js --if-needed` on every
        # start, and db/schema.sql is a destructive snapshot (23 of 42 tables are
        # dropped and recreated, the rest abort the run). So the no-op path is what
        # keeps a public deployment's data alive across restarts, redeploys and
        # OOMs. Prove the row survives, and prove the unguarded call refuses.

        run: |
          set -uo pipefail
          mysql -h 127.0.0.1 -uroot -pci-root-password ember_ci \
            -e "INSERT INTO interests (slug, label) VALUES ('survive-restart','Survive Restart')"
          echo "== --if-needed on a populated schema must skip, not re-apply =="
          node db/migrate.js --if-needed | tee migrate-skip.log
          grep -q "already present in" migrate-skip.log || { echo "expected a skip line"; exit 1; }
          node db/migrate.js --if-needed >/dev/null 2>&1 || { echo "boot-time migrate must exit 0 on a restarted container"; exit 1; }
          rows=$(mysql -h 127.0.0.1 -uroot -pci-root-password ember_ci -N -B \
                 -e "SELECT COUNT(*) FROM interests WHERE slug='survive-restart'")
          [ "$rows" = "1" ] || { echo "row lost across a restart (count=$rows) - boot wiped the database"; exit 1; }
          echo "row survived two more boots"
          echo "== the bare command must refuse rather than half-apply =="
          if node db/migrate.js >migrate-refuse.log 2>&1; then
            echo "plain migrate succeeded on a populated schema - the guard is gone"; exit 1
          fi
          grep -q "not re-runnable" migrate-refuse.log || { echo "refused for the wrong reason:"; cat migrate-refuse.log; exit 1; }
          echo "refused as designed"
          echo "== --fresh is the explicit, loud rebuild =="
          node db/migrate.js --fresh >migrate-fresh.log 2>&1 || { echo "--fresh failed:"; tail -20 migrate-fresh.log; exit 1; }
          gone=$(mysql -h 127.0.0.1 -uroot -pci-root-password ember_ci -N -B \
                 -e "SELECT COUNT(*) FROM interests WHERE slug='survive-restart'")
          [ "$gone" = "0" ] || { echo "--fresh left stale rows behind"; exit 1; }
          tables=$(mysql -h 127.0.0.1 -uroot -pci-root-password ember_ci -N -B \
                   -e "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='ember_ci'")
          [ "$tables" = "42" ] || { echo "--fresh rebuilt $tables tables, expected 42"; exit 1; }
          echo "42 tables after --fresh"
          # Put the schema back the way the next step expects it (fresh + empty).
          node db/migrate.js --if-needed | grep -q "applied 4" || true

      - name: Boot with seeded data and verify every route, asset and guard
        # One step: GitHub tears the process tree down between steps, so the server
        # has to start, be poked and be shut down inside the same shell.
        run: |
          set -uo pipefail
          NODE_ENV=development node server/server.js > server.log 2>&1 &
          SRV=$!
          trap 'echo "---- server.log ----"; tail -60 server.log' EXIT
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 1
            if ! kill -0 $SRV 2>/dev/null; then echo "server died during startup"; exit 1; fi
          done
          curl -fsS http://127.0.0.1:3000/api/health || { echo "never became healthy"; exit 1; }
          echo "== seeded demo data (development mode: the seeder's own guard allows this) =="
          node db/seed.js
          echo "== route sweep =="
          node scripts/route-sweep.mjs --base http://127.0.0.1:3000 --auth --demo
          echo "== realtime suite =="
          BASE=http://127.0.0.1:3000 node scripts/smoke-socket.js
          kill $SRV 2>/dev/null || true
          wait $SRV 2>/dev/null || true
          trap - EXIT

      - name: Boot the same build in production mode and check the deploy guards
        run: |
          set -uo pipefail
          NODE_ENV=production TRUST_PROXY=1 FORCE_HTTPS=1 node server/server.js > prod.log 2>&1 &
          SRV=$!
          trap 'echo "---- prod.log ----"; tail -60 prod.log' EXIT
          for i in $(seq 1 40); do
            curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 1
            kill -0 $SRV 2>/dev/null || { echo "server died"; exit 1; }
          done
          code() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          echo "GET /login over plain http (must upgrade):  $(code http://127.0.0.1:3000/login)"
          [ "$(code http://127.0.0.1:3000/login)" = "301" ] || { echo "expected 301"; exit 1; }
          echo "POST /api/auth/login over http (308 keeps the body): $(code -X POST http://127.0.0.1:3000/api/auth/login)"
          [ "$(code -X POST http://127.0.0.1:3000/api/auth/login)" = "308" ] || { echo "expected 308"; exit 1; }
          echo "GET /api/health unproxied (exempt, no loop): $(code http://127.0.0.1:3000/api/health)"
          [ "$(code http://127.0.0.1:3000/api/health)" = "200" ] || { echo "health must stay reachable for the container HEALTHCHECK"; exit 1; }
          echo "GET /socket.io unproxied (exempt): $(code 'http://127.0.0.1:3000/socket.io/?EIO=4&transport=polling')"
          [ "$(code 'http://127.0.0.1:3000/socket.io/?EIO=4&transport=polling')" != "301" ] || { echo "socket.io was redirected"; exit 1; }
          echo "GET /login via proxy (passes through): $(code -H 'X-Forwarded-Proto: https' http://127.0.0.1:3000/login)"
          [ "$(code -H 'X-Forwarded-Proto: https' http://127.0.0.1:3000/login)" = "200" ] || { echo "expected 200 behind the proxy"; exit 1; }
          echo "== Secure cookies in production =="
          hdrs=$(curl -sSD - -o /dev/null -H 'X-Forwarded-Proto: https' -H 'content-type: application/json' \
                 -d '{"email":"amara@example.com","password":"Password123!"}' http://127.0.0.1:3000/api/auth/login)
          echo "$hdrs" | grep -i 'set-cookie' | sed -n '1,3p'
          echo "$hdrs" | grep -qi 'ec_at=.*Secure' || { echo "access cookie is not Secure in production"; exit 1; }
          echo "== demo data cannot be seeded on a public host =="
          if NODE_ENV=production node db/seed.js > seed-prod.log 2>&1; then
            echo "seed SUCCEEDED in production - the guard is gone"; exit 1
          fi
          grep -q "refusing to create demo accounts" seed-prod.log || { echo "wrong failure:"; cat seed-prod.log; exit 1; }
          echo "refused as designed"
          kill $SRV 2>/dev/null || true
          wait $SRV 2>/dev/null || true
          trap - EXIT

      - name: deploy:check against the live database
        # Not --offline: the database is really there, so this also proves the
        # schema check and the demo-account detection work against real data.
        env:
          NODE_ENV: production
          TRUST_PROXY: '1'
          FORCE_HTTPS: '1'
          UPLOAD_DIR: /tmp/ci-uploads
        run: |
          node scripts/deploy-check.mjs | tee check.log
          # Demo accounts DO exist here (the suite seeded them), and this is not a
          # host anyone else can reach, so the checker should say so without
          # blocking: production + @example.com users is the one thing it flags.
          grep -q "demo accounts on a production host" check.log || { echo "checker missed the seeded demo accounts"; exit 1; }
          grep -q "database reachable" check.log || { echo "checker skipped the live database"; exit 1; }
          grep -q "schema applied" check.log || { echo "checker did not see 42 tables"; exit 1; }

      - name: Upload the server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-verify-logs
          path: |
            server.log
            prod.log
            seed-prod.log
            check.log

  docker:
    name: Image builds and serves /api/health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t ember:ci .

      - name: Image carries the built stylesheet and the pinned deps
        # public/css/app.css only exists because stage 1 of the Dockerfile builds
        # it - if that COPY ever breaks, every page ships unstyled and the image
        # still "builds fine". This is the check for that.
        #
        # The script is piped in rather than quoted inline, for two reasons learned
        # the hard way here: require("<dep>/package.json") throws
        # ERR_PACKAGE_PATH_NOT_EXPORTED for sharp / node-cron / file-type (their
        # "exports" maps hide the file), which looks identical to a missing
        # dependency, and a single quote inside an inline sh -c "..." closes the
        # quoting of the whole -c argument, so the container runs half a script.
        # A quoted heredoc expands nothing in the runner and needs no escaping.
        run: |
          cat > image-check.sh <<'EOF'
          set -e
          cd /app
          test -s public/css/app.css || { echo "public/css/app.css missing or empty in the image"; exit 1; }
          echo "app.css: $(wc -c < public/css/app.css) bytes"
          for d in multer sharp node-cron file-type express cookie cookie-parser jsonwebtoken zod bcrypt mysql2 socket.io; do
            test -d "node_modules/$d" || { echo "$d is not installed in the runtime image"; exit 1; }
          done
          # Read a version straight off disk - the point is proving the manifest is
          # there, not re-solving it through an exports map.
          echo "express $(sed -n "s/.*\"version\": \"\([^\"]*\)\".*/\1/p" node_modules/express/package.json | head -1)"
          if test -d node_modules/eslint; then echo "devDependencies leaked into the runtime image"; exit 1; fi
          echo "node_modules entries: $(ls node_modules | wc -l)"
          echo "image contents OK"
          EOF
          docker run --rm -i --entrypoint sh ember:ci - < image-check.sh

      - name: Booting with a broken config must refuse loudly
        # The container exits non-zero HERE on purpose - that is the pass case.
        # A deploy that fails like this is legible; a container that starts, then
        # dies on the first request is not.
        run: |
          # Nothing set at all: the base list fires first (DB_HOST/APP_ORIGIN come
          # from the environment, not from a .env baked into the image).
          out=$(docker run --rm -e NODE_ENV=production --entrypoint node ember:ci server/server.js 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then echo "expected a non-zero exit with no DB config"; exit 1; fi
          echo "$out" | grep -q "Missing required environment variables" || { echo "base env guard did not fire"; exit 1; }
          echo "refused with a clear message (exit $rc), as intended"
          # Base config present but production secrets absent: the prod-only guard.
          out=$(docker run --rm -e NODE_ENV=production -e DB_HOST=db -e DB_PORT=3306 \
            -e DB_USER=ember -e DB_NAME=ember -e DB_PASSWORD= -e APP_ORIGIN=https://x.test \
            --entrypoint node ember:ci server/server.js 2>&1) && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then echo "expected a non-zero exit with no JWT secrets"; exit 1; fi
          echo "$out" | tail -3
          echo "$out" | grep -q "Missing required production environment variables: JWT_ACCESS_SECRET, JWT_REFRESH_SECRET" || { echo "production secret guard did not fire"; exit 1; }
          echo "production secret guard fires too, and names exactly the missing vars"

      - name: Health endpoint is served without auth
        # The Dockerfile HEALTHCHECK depends on it, and a 401 there means the
        # container is killed 3 restarts in on any host.
        run: |
          grep -q "/api/health" Dockerfile || { echo "HEALTHCHECK no longer points at /api/health"; exit 1; }
          grep -rn "api/health" server/server.js | head -3
