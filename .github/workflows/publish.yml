name: Publish image

# Builds the production image and publishes it to ghcr.io (GitHub's own registry,
# so this needs no account anywhere else - only the built-in workflow token).
#
#   git tag v1.1.0 && git push origin v1.1.0        # publish
#
# A VPS can then pull and run it without ever cloning the repo:
#
#   docker pull ghcr.io/OWNER/ember-date:v1.1.0
#   docker run -d --env-file /opt/ember/.env -v ember-uploads:/app/uploads \
#     -p 127.0.0.1:3000:3000 ghcr.io/OWNER/ember-date:v1.1.0
#
# (The published image does not run migrations - the compose file does that. If
# you run it standalone, exec `node db/migrate.js` once first.)
#
# Set these to also roll a VPS onto the image automatically. Until DEPLOY_HOST is
# set the deploy job never runs, so this workflow is not half-configured by default:
#   secrets.SSH_PRIVATE_KEY   private key for the server
#   vars.DEPLOY_HOST          user@ip
#   vars.DEPLOY_PATH          /opt/ember (where the compose project lives)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (defaults to the ref name)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: tag
        run: |
          RAW="${{ github.event.inputs.tag }}"
          if [ -z "$RAW" ]; then RAW="${GITHUB_REF_NAME}"; fi
          # Registry tags must be lowercase and slash-free.
          echo "name=$(printf '%s' "$RAW" | tr 'A-Z/' 'a-z-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo "- \`${IMAGE}:${{ steps.tag.outputs.name }}\`"
            echo "- \`${IMAGE}:latest\`"
            echo ""
            echo "The image is private until you make the package public on GitHub;"
            echo "a server that pulls it needs \`docker login ghcr.io\` with a token that"
            echo "has read:packages, or the package visibility changed to public."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ env.IMAGE }}

  deploy-vps:
    name: Roll the VPS onto this image
    needs: build-and-push
    if: ${{ vars.DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      # Only to get deploy/roll.sh - the real logic lives in the repo so it can be
      # read, edited and syntax-checked like any other script instead of hiding in
      # a YAML block scalar.
      - uses: actions/checkout@v4

      - name: Deploy over ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_TAG: ${{ env.IMAGE }}:${{ needs.build-and-push.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_HOST" "IMAGE_TAG='$IMAGE_TAG' DEPLOY_PATH='${DEPLOY_PATH:-/opt/ember}' bash -s" \
            < deploy/roll.sh
