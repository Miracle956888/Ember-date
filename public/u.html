<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Profile — Ember</title>
<meta name="description" content="A profile on Ember." />
<meta name="theme-color" content="#7B35A8" />
<link rel="stylesheet" href="/css/app.css" />
<link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%237B35A8'/%3E%3Cstop offset='100%25' stop-color='%23B03A93'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M50 88C25 70 8 55 8 36 8 22 19 12 32 12c8 0 15 4 18 10 3-6 10-10 18-10 13 0 24 10 24 24 0 19-17 34-42 52z'/%3E%3C/svg%3E" />
</head>
<body class="bg-surface-grey">
<a href="#main" class="sr-only-focusable btn-primary fixed left-4 top-4 z-50">Skip to content</a>

<div class="mx-auto flex min-h-dvh w-full max-w-[560px] flex-col bg-surface shadow-card lg:my-8 lg:min-h-0 lg:rounded-4xl">

  <header class="flex items-center justify-between border-b border-hairline/[var(--hairline-a)] px-4 py-3 safe-top">
    <a href="/" class="flex items-center gap-2" aria-label="Ember home">
      <span class="grid h-8 w-8 place-items-center rounded-2xl bg-brand-gradient" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="h-[18px] w-[18px] fill-white"><path d="M12 21C7 17.5 3 14.4 3 10.5 3 7.5 5.4 5 8.5 5c1.7 0 3.3.8 4.3 2.1C13.8 5.8 15.4 5 17 5c3.1 0 5.5 2.5 5.5 5.5C22.5 14.4 18.5 17.5 13.5 21L12 22l-1.5-1z"/></svg>
      </span>
      <span class="text-lg font-extrabold tracking-tight">Ember</span>
    </a>
    <div class="flex items-center gap-1">
      <button type="button" data-action="theme" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode"
              class="theme-toggle">
        <svg viewBox="0 0 24 24" class="h-[18px] w-[18px] fill-current" aria-hidden="true" data-theme-icon></svg>
      </button>
      <a href="/app" class="btn-ghost !px-3 !py-2 text-sm" data-back-link>Open app</a>
    </div>
  </header>

  <main id="main" class="flex min-h-0 flex-1 flex-col overflow-y-auto pb-8">
    <div id="profile-state" aria-live="polite">
      <div class="px-5 py-16 text-center text-[14px] text-ink-soft">Loading profile…</div>
    </div>
  </main>
</div>

<script type="module" src="/js/u-page.js"></script>
</body>
</html>
