<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<title>Choose a new password — Ember</title>
<meta name="description" content="Set a new password for your Ember account." />
<meta name="theme-color" content="#7B35A8" />
<link rel="stylesheet" href="/css/app.css" />
<link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body class="min-h-[100dvh] bg-surface">
<main class="mx-auto flex min-h-[100dvh] max-w-[1100px] items-center justify-center px-5 py-10">
  <section class="w-full max-w-[420px] rounded-4xl border border-hairline/[var(--hairline-a)] bg-surface p-7 shadow-card-lg sm:p-9">
    <a href="/" class="mb-7 flex items-center justify-center gap-2" aria-label="Ember home">
      <span class="grid h-10 w-10 place-items-center rounded-2xl bg-brand-gradient" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="h-5 w-5 fill-white"><path d="M12 21C7 17.5 3 14.4 3 10.5 3 7.5 5.4 5 8.5 5c1.7 0 3.3.8 4.3 2.1C13.8 5.8 15.4 5 17 5c3.1 0 5.5 2.5 5.5 5.5C22.5 14.4 18.5 17.5 13.5 21L12 22l-1.5-1z"/></svg>
      </span>
      <span class="text-2xl font-extrabold tracking-tight">Ember</span>
    </a>
    <h1 class="text-center text-2xl font-extrabold tracking-tight">Choose a new password</h1>
    <p class="mt-2 text-center text-[14px] text-ink-soft">Use at least 8 characters, including a letter and a number.</p>

    <div id="form-error" class="mt-5 hidden form-error" role="alert"></div>
    <div id="form-success" class="mt-5 hidden rounded-2xl bg-like/10 px-4 py-3 text-[14px] text-ink" role="status" aria-live="polite"></div>
    <form id="reset-form" class="mt-5 space-y-4" novalidate>
      <div>
        <label class="label" for="password">New password</label>
        <input class="field" type="password" id="password" autocomplete="new-password" minlength="8" maxlength="128" required />
      </div>
      <div>
        <label class="label" for="confirm-password">Confirm new password</label>
        <input class="field" type="password" id="confirm-password" autocomplete="new-password" minlength="8" maxlength="128" required />
      </div>
      <button type="submit" id="submit" class="btn-primary btn-block !py-4 text-base">Update password</button>
    </form>
    <p class="mt-6 text-center text-[14px] text-ink-soft"><a href="/login" class="font-semibold text-brand-primary hover:underline">Back to log in</a></p>
  </section>
</main>
<script type="module" src="/js/reset-password.js"></script>
</body>
</html>
